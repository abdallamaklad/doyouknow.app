name: Deploy website
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PATH: ${{ secrets.VPS_PATH }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test
      - name: Upload static site to VPS
        if: ${{ env.VPS_HOST != '' }}
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ env.VPS_SSH_KEY }}
          REMOTE_HOST: ${{ env.VPS_HOST }}
          REMOTE_USER: ${{ env.VPS_USER }}
          TARGET: ${{ env.VPS_PATH }}
          # Mirror the generated tree, deleting removed HTML/assets so stale
          # footer URLs cannot survive on the VPS. Review VPS_PATH before merge.
          ARGS: "-rlptgoDz --delete"
          EXCLUDE: "/.git/, /.github/, /scripts/, package.json, package-lock.json, README.md, /deploy/, /docs/, /marketing/, /research/, /design/, editorial-review.json, seo-audit-report-2026-06-30.md, traffic-monetization-plan.md, MASTER_DOYOUKNOW_STRATEGY.md, MARKETING_STRATEGY.md"
      - name: TEMP diagnostic - VPS disk/webroot check
        if: ${{ env.VPS_HOST != '' }}
        run: |
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/deploy_diag_key
          chmod 600 ~/.ssh/deploy_diag_key
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_diag_key "$VPS_USER@$VPS_HOST" "VPS_PATH='$VPS_PATH' bash -s" <<'REMOTE_SCRIPT'
          echo "--- whoami / id ---"
          whoami
          id
          echo "--- df -h ---"
          df -h
          echo "--- VPS_PATH resolved to: $VPS_PATH ---"
          ls -la "$VPS_PATH"
          echo "--- en/article count and telomeres check ---"
          ls "$VPS_PATH/en/article" | wc -l
          ls "$VPS_PATH/en/article" | grep telomeres || echo "telomeres file NOT FOUND"
          echo "--- write test ---"
          touch "$VPS_PATH/en/article/_deploy_write_test" && echo "write OK" && rm "$VPS_PATH/en/article/_deploy_write_test" || echo "write FAILED"
          echo "--- docker containers ---"
          docker ps --format "table {{.Names}}\t{{.Image}}\t{{.Status}}"
          echo "--- docker containers with mounts (looking for the webroot or a static-site server) ---"
          for c in $(docker ps -q); do
            echo "== $(docker inspect --format '{{.Name}}' "$c") =="
            docker inspect --format '{{range .Mounts}}{{.Source}} -> {{.Destination}} ({{.Type}}){{"\n"}}{{end}}' "$c"
          done
          echo "--- resolved paths comparison ---"
          echo "realpath of VPS_PATH:"
          realpath "$VPS_PATH"
          echo "realpath of /var/www/doyouknow/current:"
          realpath /var/www/doyouknow/current
          echo "ls -la /var/www/doyouknow/ (parent dir, to see symlink target):"
          ls -la /var/www/doyouknow/
          echo "telomeres check inside the bind-mounted path directly:"
          ls /var/www/doyouknow/current/en/article/ | grep telomeres || echo "NOT FOUND in current"
          echo "--- locating Caddyfile on host ---"
          CADDYFILE=$(find / -maxdepth 6 -iname "Caddyfile" 2>/dev/null | head -1)
          echo "Caddyfile at: $CADDYFILE"
          echo "--- doyouknow.app block in Caddyfile ---"
          grep -B2 -A20 "doyouknow.app" "$CADDYFILE"
          echo "--- how many times does doyouknow.app appear in Caddyfile? ---"
          grep -c "doyouknow.app" "$CADDYFILE"
          echo "--- exact stat of the telomeres file ---"
          stat /var/www/doyouknow/current/en/article/how-telomeres-actually-control-cellular-aging.html
          echo "--- byte-exact filename listing (find, not ls|grep) ---"
          find /var/www/doyouknow/current/en/article -maxdepth 1 -iname "*telomere*" -print0 | xargs -0 -I{} echo "FOUND: [{}]"
          echo "--- first 200 bytes of the file ---"
          head -c 200 /var/www/doyouknow/current/en/article/how-telomeres-actually-control-cellular-aging.html
          echo ""
          echo "--- compare perms to a known-working file ---"
          stat /var/www/doyouknow/current/en/article/how-airline-ticket-pricing-actually-works.html
          echo "--- what is listening on 443? ---"
          ss -tlnp | grep :443 || netstat -tlnp | grep :443 || echo "NO LISTENER INFO"
          echo "--- second occurrence context of doyouknow.app in Caddyfile ---"
          grep -n "doyouknow.app" "$CADDYFILE"
          echo "--- host-level caddy processes (outside docker) ---"
          ps aux | grep -i caddy | grep -v grep || echo "no host-level caddy process"
          echo "--- test from inside the box, correct SNI via --resolve (real origin test) ---"
          curl -sk -o /dev/null -w "origin https telomeres: %{http_code}\n" --resolve doyouknow.app:443:127.0.0.1 https://doyouknow.app/en/article/how-telomeres-actually-control-cellular-aging.html || echo "curl exit: $?"
          curl -sk -o /dev/null -w "origin https known-good: %{http_code}\n" --resolve doyouknow.app:443:127.0.0.1 https://doyouknow.app/en/article/how-airline-ticket-pricing-actually-works.html || echo "curl exit: $?"
          echo "--- full response body head for telomeres via origin ---"
          curl -sk --resolve doyouknow.app:443:127.0.0.1 https://doyouknow.app/en/article/how-telomeres-actually-control-cellular-aging.html | head -c 300 || echo "curl body fetch failed"
          REMOTE_SCRIPT
