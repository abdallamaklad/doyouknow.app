name: Deploy website
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PATH: ${{ secrets.VPS_PATH }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      # Keep committed sitemap.xml <lastmod> in sync with each page's dateModified
      # (CI never runs `npm run build`, so without this the deployed sitemap drifts stale).
      - run: node scripts/sync-sitemap-lastmod.mjs
      - run: npm test
      - name: Upload static site to VPS
        if: ${{ env.VPS_HOST != '' }}
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ env.VPS_SSH_KEY }}
          REMOTE_HOST: ${{ env.VPS_HOST }}
          REMOTE_USER: ${{ env.VPS_USER }}
          TARGET: ${{ env.VPS_PATH }}
          # Mirror the generated tree, deleting removed HTML/assets so stale
          # footer URLs cannot survive on the VPS. Review VPS_PATH before merge.
          ARGS: "-rlptgoDz --delete"
          # .env* is excluded because rsync mirrors into the public web root —
          # without this, .env.example would be served at doyouknow.app/.env.example,
          # which is exactly what credential scanners crawl for.
          EXCLUDE: "/.git/, /.github/, /scripts/, package.json, package-lock.json, README.md, .env, .env.example, /deploy/, /docs/, /marketing/, /research/, /design/, editorial-review.json, sensitivity-approvals.json, CLAUDE.md, seo-audit-report-2026-06-30.md, traffic-monetization-plan.md, MASTER_DOYOUKNOW_STRATEGY.md, MARKETING_STRATEGY.md"
      # Ping IndexNow (Bing/Copilot, Yandex, Seznam, Naver) with the pages this push
      # changed, so they recrawl in hours. Runs only after a real upload, never
      # fails the deploy, and only submits URLs that are in sitemap.xml.
      - name: Submit changed pages to IndexNow
        if: ${{ env.VPS_HOST != '' && github.event_name == 'push' }}
        continue-on-error: true
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "No previous commit to diff against; skipping."; exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BEFORE"
          git diff --name-only --diff-filter=AM "$BEFORE" "$GITHUB_SHA" -- '*.html' > "$RUNNER_TEMP/changed.txt"
          echo "$(wc -l < "$RUNNER_TEMP/changed.txt") changed HTML files"
          xargs -a "$RUNNER_TEMP/changed.txt" -r node scripts/indexnow-submit.mjs
